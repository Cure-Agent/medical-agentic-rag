[project]
name = "medical-agentic-rag"
version = "0.1.0"
description = "Ablation study of Agentic RAG interventions on medical guidelines"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-openai",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    # 타입 게이트(make typecheck)는 릴리스마다 추론이 바뀌므로 정확히 고정한다 — 올릴 때 명시적으로 올린다
    "pyright==1.1.414",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright==1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "evals", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
